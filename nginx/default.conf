# Plantilla procesada por envsubst al arrancar el contenedor nginx oficial.
# Solo se sustituyen ${API_KEY}, ${FARM_API_HOST}, ${FARM_API_PORT} y ${CORS_ORIGIN_REGEX}
# (ver NGINX_ENVSUBST_FILTER).

# Validación de la API key (cabecera X-API-KEY).
# Bucket ampliado: una key de 64 caracteres (openssl rand -hex 32) no cabe en el valor por defecto.
map_hash_bucket_size 128;
map $http_x_api_key $proxi_api_key_ok {
    default      0;
    "${API_KEY}" 1;
}

# CORS: solo se devuelve Access-Control-Allow-Origin si el Origin coincide con la regex.
map $http_origin $proxi_cors_origin {
    default                 "";
    "~${CORS_ORIGIN_REGEX}" $http_origin;
}

# Orígenes locales (VPS/Docker). Usa la IP real tras aplicar CF-Connecting-IP.
geo $proxi_origen_local {
    default         0;
    127.0.0.1       1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
}

# Límite general por IP real del cliente y límite de rotación por dispositivo.
limit_req_zone $binary_remote_addr zone=proxi_por_ip:10m rate=30r/m;
limit_req_zone $uri                zone=proxi_rotacion:1m rate=6r/m;
limit_req_status 429;

# API Flask de control en el servidor HP (IP de Tailscale/WireGuard).
upstream granja_api {
    server ${FARM_API_HOST}:${FARM_API_PORT} max_fails=3 fail_timeout=30s;
    keepalive 8;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # IP real del cliente enviada por Cloudflare (cloudflared llega desde el host/bridge de Docker).
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    default_type application/json;
    client_max_body_size 1k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    # CORS (cabeceras vacías no se envían: orígenes no permitidos no reciben Allow-Origin).
    add_header Access-Control-Allow-Origin $proxi_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "X-API-KEY, Content-Type" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Vary Origin always;

    # Preflight CORS: responde antes de exigir API key (el navegador no la envía en OPTIONS).
    if ($request_method = OPTIONS) {
        return 204;
    }

    error_page 403 @prohibido;
    error_page 429 @limite_excedido;
    error_page 502 503 504 = @granja_no_disponible;

    # Healthcheck local: accesible solo desde el VPS/Docker, no desde Cloudflare.
    location = /healthz {
        access_log off;
        if ($proxi_origen_local = 0) {
            return 403 '{"error":"forbidden"}';
        }
        return 200 '{"status":"ok"}';
    }

    location = /status {
        limit_except GET { deny all; }
        if ($proxi_api_key_ok = 0) {
            return 401 '{"error":"unauthorized"}';
        }
        limit_req zone=proxi_por_ip burst=10 nodelay;

        proxy_pass http://granja_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-API-KEY "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # /rotate/redmi y /rotate/lg: el cambio de datos móviles por ADB puede tardar.
    location ~ ^/rotate/(redmi|lg)$ {
        limit_except GET { deny all; }
        if ($proxi_api_key_ok = 0) {
            return 401 '{"error":"unauthorized"}';
        }
        limit_req zone=proxi_por_ip burst=10 nodelay;
        limit_req zone=proxi_rotacion burst=2 nodelay;

        proxy_pass http://granja_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-API-KEY "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_next_upstream off;
    }

    location / {
        return 404 '{"error":"not_found"}';
    }

    location @prohibido {
        return 403 '{"error":"forbidden"}';
    }

    location @limite_excedido {
        return 429 '{"error":"rate_limited"}';
    }

    location @granja_no_disponible {
        return 502 '{"error":"farm_unreachable"}';
    }
}
