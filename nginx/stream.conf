# Entrada pública del tráfico de proxy (HTTP/SOCKS5, autenticado por 3proxy en el HP).
# Plantilla procesada por envsubst: solo ${FARM_API_HOST} y ${PROXY_PORTS}.
# Cada puerto público P se reenvía por Tailscale a FARM_API_HOST:P, donde el HP lo lleva al 3proxy de su móvil.
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
}

stream {
    # Registro de trazabilidad: una línea por sesión al cerrarse (hora UTC de cierre; inicio = cierre - duración).
    # IP y puerto de origen del cliente + puerto público (= móvil). El backend sabe qué cliente tenía cada
    # móvil y con qué IP pública. Se conserva 365 días (logrotate/proxi-movil). No registra contenido.
    log_format proxi_sesion '$time_iso8601 cliente=$remote_addr:$remote_port puerto=$server_port '
                            'estado=$status enviados=$bytes_sent recibidos=$bytes_received duracion=$session_time';
    access_log /var/log/proxi-movil/stream.log proxi_sesion buffer=32k flush=10s;

    server {
        listen ${PROXY_PORTS};
        proxy_pass ${FARM_API_HOST}:$server_port;
        proxy_connect_timeout 10s;
        proxy_timeout 30m;
    }
}
