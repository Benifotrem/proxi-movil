# Inventario de la granja. Una línea por móvil.
#   id          nombre del móvil y de su namespace (a-z, 0-9, _; máx. 15). Convención: modem_<puerto USB>
#   usb         puerto USB físico (readlink /sys/class/net/<iface>/device -> .../<usb>/<usb>:1.0)
#   adb_serial  serial de "adb devices"
#   puerto      puerto público (VPS) = puerto de entrada en el HP; 20001-20250 (define la red 10.200.N.0/30, N = puerto - 20000)
#   rotacion    airplane (modo avión, solo radio celular) | data (svc data off/on, Android < 8)
#
# id          usb   adb_serial       puerto  rotacion
modem_2_3     2-3   c698d0867d32     20001   airplane
modem_2_4     2-4   LMX210c09bb44c   20002   data
