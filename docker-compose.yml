# Gateway público de la granja de proxies móviles.
# - Escucha SOLO en 127.0.0.1:3105 (no toca syry_nginx ni los puertos 80/443).
# - Cloudflare Tunnel (cloudflared en el host) entrega el tráfico a 127.0.0.1:3105.
# - Nginx valida X-API-KEY y reenvía a la API Flask del servidor HP por Tailscale/WireGuard.
name: proxi-movil

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: proxi_movil_gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3105:8080"
    environment:
      API_KEY: ${API_KEY:?Define API_KEY en .env}
      FARM_API_HOST: ${FARM_API_HOST:?Define FARM_API_HOST en .env}
      FARM_API_PORT: ${FARM_API_PORT:-5000}
      # Solo se sustituyen estas variables; las de nginx ($host, $uri...) quedan intactas.
      NGINX_ENVSUBST_FILTER: "^(API_KEY|FARM_API_HOST|FARM_API_PORT)$"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      - proxi_movil_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxi_movil_net:
    name: proxi_movil_net
    driver: bridge
